<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Kim Ne Taktı?</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/KimNeTakti/favicon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --text: #1a1a1f; --text-secondary: #73737a;
    --primary: #e31a24; --border: #eee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121214; --surface: #1c1c1f; --text: #f2f2f3; --text-secondary: #a0a0a6; --border: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 420px; padding: 40px 24px; text-align: center; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  p { color: var(--text-secondary); margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.button {
    display: block; padding: 14px 24px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--primary); text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/KimNeTakti/icon-512.png" alt="" width="80" height="80">
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p>
    <div class="links">
      <a class="button" href="/KimNeTakti/">Ana sayfa</a>
      <a class="button" href="/KimNeTakti/support.html">Destek</a>
      <a class="button" href="/KimNeTakti/privacy.html">Gizlilik Politikası</a>
    </div>
  </div>
</body>
</html>
